name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
          - os: macos-15-intel
            bundles: dmg
    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run sidecar:prepare
      - name: Check Rust and hledger integration
        run: npm run test:backend -- --bundled
      - name: Compile desktop app with bundled hledger
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build -- --no-bundle --config src-tauri/tauri.bundle.conf.json
      - name: Test native background service lifecycle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/test-office-service.mjs --native
      - name: Build release installers
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --config src-tauri/tauri.bundle.conf.json
      - name: Test packaged release server
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/test-office-service.mjs --native
      - name: Collect release dependency notices
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/collect-notices.py
      - name: Upload release installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
      - name: Upload release notices
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: notices-${{ matrix.os }}
          path: release-notices/
          if-no-files-found: error
