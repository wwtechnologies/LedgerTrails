name: Windows release build
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing release tag to build
        required: true
        default: v0.1.1
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run sidecar:prepare
      - run: npm run test:backend -- --bundled
      - run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.bundle.conf.json
      - run: node scripts/test-office-service.mjs --native
      - run: python -X utf8 scripts/collect-notices.py
      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows-latest
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: notices-windows-latest
          path: release-notices/
          if-no-files-found: error
